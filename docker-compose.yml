version: "3.8"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/forwork
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: danil
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: forwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: danil
    ports:
      - "5432:5432"
    volumes:
      - forwork-db-data:/var/lib/postgresql/data

volumes:
  forwork-db-data:
